name: Publish release

on:
  workflow_dispatch:
    inputs:
      llvm-branch:
        description: The LLVM branch to release from
        type: string
        required: true
      version:
        description: The version number to release
        type: string
        required: true
      python-version:
        description: The Python version to build the wheel for
        type: string
        required: true

jobs:
  build:
    name: Build dist files
    runs-on: ubuntu-latest  # TODO: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v7

      - name: Set version in pyproject.toml
        run: |
          sed -i 's/VERSION/"${{ inputs.version }}"/' pyproject.toml
          cat pyproject.toml

      - name: Clone LLVM
        uses: actions/checkout@v7
        with:
          repository: llvm/llvm-project
          path: llvm-project
          ref: ${{ inputs.llvm-branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Build wheel
        run: |
          pip install build
          SKBUILD_CMAKE_SOURCE_DIR=llvm-project/llvm python -m build --wheel --verbose .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # pypi:
  #   name: Push dist to PyPI
  #   needs: build
  #   runs-on: ubuntu-latest
  #   environment:
  #     name: release
  #   permissions:
  #     id-token: write
  #   steps:
  #     - name: Download artifacts
  #       uses: actions/download-artifact@v4
  #       with:
  #         name: dist
  #         path: dist/
  #
  #     - name: Publish to PyPI
  #       uses: pypa/gh-action-pypi-publish@release/v1

  github_release:
    name: Create GitHub release
    # needs: pypi
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload --clobber 2026.0 dist/*
